name: Daily Job Ingest

on:
  schedule:
    # 매일 06:00 KST (UTC 21:00)
    - cron: '0 21 * * *'
  workflow_dispatch:

concurrency:
  group: daily-job-ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest Live Job Postings
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run live job ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: node scripts/run-ingest.mjs --live
